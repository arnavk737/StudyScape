<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notebooks - StudyScape</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
      min-height: 100vh;
    }

    /* Header */
    header {
      background: white;
      padding: 1.5rem 2rem;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.75rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-btn {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    /* Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .page-header h2 {
      font-size: 2rem;
      color: #1e293b;
    }

    .add-notebook-btn {
      padding: 0.875rem 2rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .add-notebook-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }

    /* Notebook Grid */
    .notebook-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .notebook-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .notebook-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }

    .notebook-cover {
      height: 180px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .notebook-cover::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(255,255,255,0.05) 10px,
        rgba(255,255,255,0.05) 20px
      );
    }

    .notebook-icon {
      font-size: 4rem;
      color: white;
      z-index: 1;
    }

    .notebook-content {
      padding: 1.5rem;
    }

    .notebook-content h3 {
      font-size: 1.25rem;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .notebook-meta {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    .notebook-actions {
      display: flex;
      gap: 0.5rem;
    }

    .notebook-btn {
      flex: 1;
      padding: 0.625rem;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .open-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .delete-btn {
      background: #fee2e2;
      color: #dc2626;
    }

    .delete-btn:hover {
      background: #dc2626;
      color: white;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      animation: fadeIn 0.3s;
    }

    .modal.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      max-width: 500px;
      width: 90%;
      animation: slideUp 0.3s;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content h2 {
      margin-bottom: 1.5rem;
      color: #1e293b;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #334155;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 0.875rem;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .color-picker {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .color-option {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.3s;
    }

    .color-option:hover {
      transform: scale(1.1);
    }

    .color-option.selected {
      border-color: #1e293b;
      box-shadow: 0 0 0 2px white, 0 0 0 4px #1e293b;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .modal-actions button {
      flex: 1;
      padding: 0.875rem;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .save-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .cancel-btn {
      background: #f8fafc;
      color: #64748b;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #94a3b8;
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    @media (max-width: 768px) {
      .notebook-grid {
        grid-template-columns: 1fr;
      }

      header {
        padding: 1rem;
      }

      .container {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>📓 Notebooks</h1>
    <button class="back-btn" onclick="window.location.href='dashboard.html'">
      <i class="fas fa-arrow-left"></i> Dashboard
    </button>
  </header>

  <div class="container">
    <div class="page-header">
      <h2>Your Notebooks</h2>
      <button class="add-notebook-btn" onclick="openNotebookModal()">
        <i class="fas fa-plus"></i> New Notebook
      </button>
    </div>
    <div class="notebook-grid" id="notebook-list"></div>
  </div>

  <!-- Create Notebook Modal -->
  <div class="modal" id="notebook-modal">
    <div class="modal-content">
      <h2>Create New Notebook</h2>
      <form onsubmit="saveNotebook(event)">
        <div class="form-group">
          <label for="notebook-name">Notebook Name</label>
          <input type="text" id="notebook-name" placeholder="e.g., Chemistry Notes" required>
        </div>
        <div class="form-group">
          <label>Cover Color</label>
          <div class="color-picker" id="color-picker">
            <div class="color-option selected" data-color="#667eea,#764ba2" style="background: linear-gradient(135deg, #667eea, #764ba2)"></div>
            <div class="color-option" data-color="#f093fb,#f5576c" style="background: linear-gradient(135deg, #f093fb, #f5576c)"></div>
            <div class="color-option" data-color="#4facfe,#00f2fe" style="background: linear-gradient(135deg, #4facfe, #00f2fe)"></div>
            <div class="color-option" data-color="#43e97b,#38f9d7" style="background: linear-gradient(135deg, #43e97b, #38f9d7)"></div>
            <div class="color-option" data-color="#fa709a,#fee140" style="background: linear-gradient(135deg, #fa709a, #fee140)"></div>
            <div class="color-option" data-color="#30cfd0,#330867" style="background: linear-gradient(135deg, #30cfd0, #330867)"></div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="submit" class="save-btn">Create Notebook</button>
          <button type="button" class="cancel-btn" onclick="closeNotebookModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;
    let notebooks = [];
    let selectedColor = '#667eea,#764ba2';

    async function init() {
      currentUser = await db.getCurrentUser();
      if (!currentUser) {
        window.location.href = 'signin.html';
        return;
      }
      await loadNotebooks();
    }

    async function loadNotebooks() {
      const { data, error } = await db.getNotebooks(currentUser.id);
      
      if (error) {
        console.error('Error loading notebooks:', error);
        return;
      }

      notebooks = data || [];
      renderNotebooks();
    }

    function renderNotebooks() {
      const notebookList = document.getElementById('notebook-list');
      
      if (notebooks.length === 0) {
        notebookList.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-book"></i>
            <h3>No notebooks yet</h3>
            <p>Create your first notebook to start taking notes!</p>
          </div>
        `;
        return;
      }

      notebookList.innerHTML = notebooks.map(notebook => {
        const [color1, color2] = (notebook.color || '667eea,764ba2').split(',');
        const pageCount = notebook.pages?.length || 0;
        
        return `
          <div class="notebook-card">
            <div class="notebook-cover" style="background: linear-gradient(135deg, #${color1}, #${color2})">
              <i class="notebook-icon fas fa-book"></i>
            </div>
            <div class="notebook-content">
              <h3>${notebook.name}</h3>
              <div class="notebook-meta">
                <span><i class="fas fa-file"></i> ${pageCount} pages</span>
                <span><i class="fas fa-clock"></i> ${formatDate(notebook.created_at)}</span>
              </div>
              <div class="notebook-actions">
                <button class="notebook-btn open-btn" onclick="openNotebook('${notebook.id}')">
                  <i class="fas fa-folder-open"></i> Open
                </button>
                <button class="notebook-btn delete-btn" onclick="deleteNotebook('${notebook.id}')">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diff = now - date;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      
      if (days === 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 7) return `${days} days ago`;
      return date.toLocaleDateString();
    }

    function openNotebook(notebookId) {
      localStorage.setItem('currentNotebook', notebookId);
      window.location.href = 'notebook.html';
    }

    function openNotebookModal() {
      document.getElementById('notebook-modal').classList.add('active');
    }

    function closeNotebookModal() {
      document.getElementById('notebook-modal').classList.remove('active');
      document.getElementById('notebook-name').value = '';
    }

    async function saveNotebook(e) {
      e.preventDefault();
      const name = document.getElementById('notebook-name').value.trim();
      
      const { data, error } = await db.createNotebook(currentUser.id, name, 'mixed', selectedColor);
      
      if (error) {
        alert('Error creating notebook: ' + error.message);
        return;
      }

      closeNotebookModal();
      await loadNotebooks();
    }

    async function deleteNotebook(notebookId) {
      if (!confirm('Delete this notebook and all its pages?')) return;
      
      const { error } = await db.deleteNotebook(notebookId);
      
      if (error) {
        alert('Error deleting notebook: ' + error.message);
        return;
      }

      await loadNotebooks();
    }

    // Color picker
    document.addEventListener('DOMContentLoaded', () => {
      const colorOptions = document.querySelectorAll('.color-option');
      colorOptions.forEach(option => {
        option.addEventListener('click', () => {
          colorOptions.forEach(o => o.classList.remove('selected'));
          option.classList.add('selected');
          selectedColor = option.dataset.color;
        });
      });
    });

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
