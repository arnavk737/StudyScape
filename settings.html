<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - StudyScape</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.4;
      animation: float 20s infinite ease-in-out;
    }

    .orb1 {
      width: 400px;
      height: 400px;
      background: rgba(67, 233, 123, 0.4);
      top: -100px;
      left: -100px;
    }

    .orb2 {
      width: 300px;
      height: 300px;
      background: rgba(56, 249, 215, 0.4);
      bottom: -50px;
      right: -50px;
      animation-delay: 7s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(50px, -50px); }
      66% { transform: translate(-30px, 30px); }
    }

    .container {
      text-align: center;
      z-index: 1;
      max-width: 600px;
      padding: 2rem;
    }

    .coming-soon-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 4rem 3rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      font-size: 5rem;
      margin-bottom: 2rem;
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      font-size: 2.5rem;
      color: #1e293b;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: #64748b;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .features {
      background: #f8fafc;
      border-radius: 16px;
      padding: 2rem;
      margin: 2rem 0;
      text-align: left;
    }

    .features h3 {
      color: #1e293b;
      margin-bottom: 1rem;
    }

    .features ul {
      list-style: none;
      padding: 0;
    }

    .features li {
      padding: 0.75rem 0;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .features li i {
      color: #43e97b;
    }

    .back-btn {
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(67, 233, 123, 0.4);
    }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="container">
    <div class="coming-soon-card">
      <div class="icon">
        <i class="fas fa-cog"></i>
      </div>
      <h1>Settings Coming Soon!</h1>
      <p>We're building a comprehensive settings panel to help you customize your StudyScape experience.</p>
      
      <div class="features">
        <h3>What to Expect:</h3>
        <ul>
          <li><i class="fas fa-check-circle"></i> Profile customization</li>
          <li><i class="fas fa-check-circle"></i> Dark mode toggle</li>
          <li><i class="fas fa-check-circle"></i> Notification preferences</li>
          <li><i class="fas fa-check-circle"></i> Export/import your data</li>
          <li><i class="fas fa-check-circle"></i> Account security options</li>
        </ul>
      </div>

      <button class="back-btn" onclick="window.location.href='dashboard.html'">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
      </button>
    </div>
  </div>
</body>
</html>
