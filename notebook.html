<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notebook Editor - StudyScape</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/[email protected]/dist/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/[email protected]/dist/quill.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Configure PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <script src="supabase-config.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Toolbar */
    .toolbar {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .notebook-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      flex: 1;
    }

    .toolbar-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0 1rem;
      border-right: 1px solid #e2e8f0;
    }

    .toolbar-group:last-child {
      border-right: none;
    }

    .tool-btn {
      padding: 0.5rem 1rem;
      background: #f8fafc;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9rem;
      font-weight: 600;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tool-btn:hover {
      background: #e0e7ff;
      color: #667eea;
    }

    .tool-btn.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border-color: #667eea;
    }

    .exit-btn {
      padding: 0.625rem 1.25rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .exit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    /* Main Content */
    .editor-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: white;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h3 {
      font-size: 1rem;
      color: #1e293b;
    }

    .add-page-btn {
      padding: 0.5rem;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .add-page-btn:hover {
      background: #764ba2;
    }

    .page-list {
      flex: 1;
      overflow-y: auto;
    }

    .page-item {
      padding: 1rem;
      border-bottom: 1px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .page-item:hover {
      background: #f8fafc;
    }

    .page-item.active {
      background: #e0e7ff;
      border-left: 3px solid #667eea;
    }

    .page-preview {
      width: 40px;
      height: 50px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .page-info {
      flex: 1;
    }

    .page-number {
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e293b;
    }

    .page-type {
      font-size: 0.75rem;
      color: #64748b;
    }

    .delete-page-btn {
      padding: 0.25rem 0.5rem;
      background: #fee2e2;
      color: #dc2626;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: all 0.3s;
    }

    .page-item:hover .delete-page-btn {
      opacity: 1;
    }

    /* Editor Area */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #e5e7eb;
      position: relative;
    }

    .page-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .page-content {
      width: 100%;
      max-width: 850px;
      background: white;
      min-height: 1100px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      position: relative;
    }

    /* Text Editor */
    .text-editor {
      display: none;
      height: 100%;
    }

    .text-editor.active {
      display: block;
    }

    #editor {
      height: 100%;
      border: none;
    }

    .ql-container {
      font-size: 16px;
      font-family: 'Inter', sans-serif;
    }

    .ql-editor {
      padding: 3rem;
      min-height: 1100px;
    }

    /* Drawing Canvas */
    .drawing-canvas {
      display: none;
      position: relative;
      width: 100%;
      height: 100%;
    }

    .drawing-canvas.active {
      display: block;
    }

    #canvas {
      width: 100%;
      height: 1100px;
      cursor: crosshair;
      background: white;
    }

    /* Drawing Tools */
    .drawing-tools {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 1rem;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      display: none;
      gap: 1rem;
      align-items: center;
      z-index: 10;
    }

    .drawing-tools.active {
      display: flex;
    }

    .tool-group {
      display: flex;
      gap: 0.5rem;
      padding: 0 1rem;
      border-right: 1px solid #e2e8f0;
    }

    .tool-group:last-child {
      border-right: none;
    }

    .draw-tool {
      width: 40px;
      height: 40px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
    }

    .draw-tool:hover {
      background: #e0e7ff;
      color: #667eea;
    }

    .draw-tool.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.3s;
    }

    .color-btn.active {
      border-color: #1e293b;
      box-shadow: 0 0 0 2px white, 0 0 0 4px #1e293b;
    }

    .size-slider {
      width: 100px;
    }

    /* PDF Viewer */
    .pdf-viewer {
      display: none;
      width: 100%;
      height: 100%;
      overflow-y: auto;
    }

    .pdf-viewer.active {
      display: block;
    }

    .pdf-page {
      margin-bottom: 1rem;
    }

    /* Loading */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #64748b;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        width: 60px;
      }

      .page-info, .sidebar-header h3 {
        display: none;
      }

      .toolbar-group {
        padding: 0 0.5rem;
      }

      .page-container {
        padding: 1rem;
      }

      .ql-editor {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="notebook-title" id="notebook-title">Untitled Notebook</div>
    
    <div class="toolbar-group">
      <button class="tool-btn active" id="type-mode-btn" onclick="switchMode('type')">
        <i class="fas fa-keyboard"></i> Type
      </button>
      <button class="tool-btn" id="draw-mode-btn" onclick="switchMode('draw')">
        <i class="fas fa-pen"></i> Draw
      </button>
    </div>

    <div class="toolbar-group">
      <label class="tool-btn" for="pdf-upload" style="margin: 0;">
        <i class="fas fa-file-pdf"></i> Import PDF
      </label>
      <input type="file" id="pdf-upload" accept="application/pdf" style="display: none;" onchange="handlePDFUpload(event)">
    </div>

    <button class="exit-btn" onclick="saveAndExit()">
      <i class="fas fa-save"></i> Save & Exit
    </button>
  </div>

  <!-- Main Content -->
  <div class="editor-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Pages</h3>
        <button class="add-page-btn" onclick="addPage()">
          <i class="fas fa-plus"></i>
        </button>
      </div>
      <div class="page-list" id="page-list"></div>
    </div>

    <!-- Editor Area -->
    <div class="editor-area">
      <div class="page-container">
        <div class="page-content">
          <!-- Text Editor -->
          <div class="text-editor active" id="text-editor">
            <div id="editor"></div>
          </div>

          <!-- Drawing Canvas -->
          <div class="drawing-canvas" id="drawing-canvas">
            <canvas id="canvas"></canvas>
          </div>

          <!-- PDF Viewer -->
          <div class="pdf-viewer" id="pdf-viewer"></div>

          <!-- Loading State -->
          <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading notebook...</p>
          </div>
        </div>
      </div>

      <!-- Drawing Tools -->
      <div class="drawing-tools" id="drawing-tools">
        <div class="tool-group">
          <button class="draw-tool active" data-tool="pen" onclick="selectDrawTool('pen')">
            <i class="fas fa-pen"></i>
          </button>
          <button class="draw-tool" data-tool="highlighter" onclick="selectDrawTool('highlighter')">
            <i class="fas fa-highlighter"></i>
          </button>
          <button class="draw-tool" data-tool="eraser" onclick="selectDrawTool('eraser')">
            <i class="fas fa-eraser"></i>
          </button>
        </div>

        <div class="tool-group">
          <button class="color-btn active" style="background: #000000" onclick="selectColor('#000000')"></button>
          <button class="color-btn" style="background: #dc2626" onclick="selectColor('#dc2626')"></button>
          <button class="color-btn" style="background: #2563eb" onclick="selectColor('#2563eb')"></button>
          <button class="color-btn" style="background: #16a34a" onclick="selectColor('#16a34a')"></button>
          <button class="color-btn" style="background: #facc15" onclick="selectColor('#facc15')"></button>
        </div>

        <div class="tool-group">
          <input type="range" class="size-slider" min="1" max="20" value="3" onchange="updateBrushSize(this.value)">
        </div>

        <div class="tool-group">
          <button class="draw-tool" onclick="clearCanvas()">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentNotebook = null;
    let currentPageIndex = 0;
    let quill = null;
    let canvas = null;
    let ctx = null;
    let isDrawing = false;
    let currentTool = 'pen';
    let currentColor = '#000000';
    let brushSize = 3;
    let drawingHistory = [];

    async function init() {
      currentUser = await db.getCurrentUser();
      if (!currentUser) {
        window.location.href = 'signin.html';
        return;
      }

      const notebookId = localStorage.getItem('currentNotebook');
      if (!notebookId) {
        window.location.href = 'notes.html';
        return;
      }

      await loadNotebook(notebookId);
      initializeEditor();
      initializeCanvas();
    }

    async function loadNotebook(notebookId) {
      try {
        const { data: notebooks, error } = await db.getNotebooks(currentUser.id);
        
        if (error) {
          console.error('Error loading notebook:', error);
          alert('Error loading notebook: ' + error.message);
          window.location.href = 'notes.html';
          return;
        }

        currentNotebook = notebooks.find(n => n.id === notebookId);
        
        if (!currentNotebook) {
          alert('Notebook not found');
          window.location.href = 'notes.html';
          return;
        }

        document.getElementById('notebook-title').textContent = currentNotebook.name;
        
        // Initialize pages if empty
        if (!currentNotebook.pages || currentNotebook.pages.length === 0) {
          currentNotebook.pages = [{
            type: 'text',
            content: '',
            drawing: null,
            pdfData: null
          }];
        }

        renderPageList();
        loadPage(0);
        document.getElementById('loading').style.display = 'none';
      } catch (err) {
        console.error('Unexpected error:', err);
        alert('Failed to load notebook. Please try again.');
        window.location.href = 'notes.html';
      }
    }

    function initializeEditor() {
      quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
          toolbar: [
            [{ 'header': [1, 2, 3, false] }],
            ['bold', 'italic', 'underline', 'strike'],
            [{ 'color': [] }, { 'background': [] }],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            [{ 'align': [] }],
            ['link', 'image'],
            ['clean']
          ]
        }
      });

      quill.on('text-change', () => {
        if (currentNotebook && currentNotebook.pages[currentPageIndex]) {
          currentNotebook.pages[currentPageIndex].content = quill.root.innerHTML;
        }
      });
    }

    function initializeCanvas() {
      canvas = document.getElementById('canvas');
      ctx = canvas.getContext('2d');
      
      canvas.width = 850;
      canvas.height = 1100;

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseout', stopDrawing);

      // Touch support
      canvas.addEventListener('touchstart', handleTouch);
      canvas.addEventListener('touchmove', handleTouch);
      canvas.addEventListener('touchend', stopDrawing);
    }

    function startDrawing(e) {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function draw(e) {
      if (!isDrawing) return;

      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      ctx.lineWidth = brushSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
      } else if (currentTool === 'highlighter') {
        ctx.globalCompositeOperation = 'multiply';
        ctx.strokeStyle = currentColor;
        ctx.globalAlpha = 0.3;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor;
        ctx.globalAlpha = 1;
      }

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        saveCanvasState();
      }
    }

    function handleTouch(e) {
      e.preventDefault();
      const touch = e.touches[0];
      const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : 'mousemove', {
        clientX: touch.clientX,
        clientY: touch.clientY
      });
      canvas.dispatchEvent(mouseEvent);
    }

    function saveCanvasState() {
      if (currentNotebook && currentNotebook.pages[currentPageIndex]) {
        currentNotebook.pages[currentPageIndex].drawing = canvas.toDataURL();
      }
    }

    function renderPageList() {
      const pageList = document.getElementById('page-list');
      pageList.innerHTML = currentNotebook.pages.map((page, index) => `
        <div class="page-item ${index === currentPageIndex ? 'active' : ''}" onclick="loadPage(${index})">
          <div class="page-preview">
            <i class="fas fa-${page.type === 'pdf' ? 'file-pdf' : page.type === 'draw' ? 'pen' : 'align-left'}"></i>
          </div>
          <div class="page-info">
            <div class="page-number">Page ${index + 1}</div>
            <div class="page-type">${page.type === 'pdf' ? 'PDF' : page.type === 'draw' ? 'Drawing' : 'Text'}</div>
          </div>
          <button class="delete-page-btn" onclick="deletePage(event, ${index})">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      `).join('');
    }

    function loadPage(index) {
      currentPageIndex = index;
      const page = currentNotebook.pages[index];

      // Hide all views
      document.getElementById('text-editor').classList.remove('active');
      document.getElementById('drawing-canvas').classList.remove('active');
      document.getElementById('pdf-viewer').classList.remove('active');
      document.getElementById('drawing-tools').classList.remove('active');

      if (page.type === 'text' || page.type === 'mixed') {
        document.getElementById('text-editor').classList.add('active');
        quill.root.innerHTML = page.content || '';
        
        if (page.drawing) {
          // Load drawing overlay (TODO: implement overlay)
        }
      } else if (page.type === 'draw') {
        document.getElementById('drawing-canvas').classList.add('active');
        document.getElementById('drawing-tools').classList.add('active');
        
        if (page.drawing) {
          const img = new Image();
          img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
          };
          img.src = page.drawing;
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      } else if (page.type === 'pdf') {
        document.getElementById('pdf-viewer').classList.add('active');
        if (page.pdfData) {
          renderPDF(page.pdfData);
        }
      }

      renderPageList();
    }

    function addPage() {
      currentNotebook.pages.push({
        type: 'text',
        content: '',
        drawing: null,
        pdfData: null
      });
      renderPageList();
      loadPage(currentNotebook.pages.length - 1);
    }

    function deletePage(event, index) {
      event.stopPropagation();
      if (currentNotebook.pages.length === 1) {
        alert('Cannot delete the last page');
        return;
      }
      
      if (confirm('Delete this page?')) {
        currentNotebook.pages.splice(index, 1);
        if (currentPageIndex >= currentNotebook.pages.length) {
          currentPageIndex = currentNotebook.pages.length - 1;
        }
        renderPageList();
        loadPage(currentPageIndex);
      }
    }

    function switchMode(mode) {
      document.getElementById('type-mode-btn').classList.remove('active');
      document.getElementById('draw-mode-btn').classList.remove('active');

      if (mode === 'type') {
        document.getElementById('type-mode-btn').classList.add('active');
        currentNotebook.pages[currentPageIndex].type = 'text';
        loadPage(currentPageIndex);
      } else {
        document.getElementById('draw-mode-btn').classList.add('active');
        currentNotebook.pages[currentPageIndex].type = 'draw';
        loadPage(currentPageIndex);
      }
    }

    function selectDrawTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.draw-tool[data-tool]').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`[data-tool="${tool}"]`).classList.add('active');
    }

    function selectColor(color) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    function updateBrushSize(size) {
      brushSize = parseInt(size);
    }

    function clearCanvas() {
      if (confirm('Clear this page?')) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveCanvasState();
      }
    }

    async function handlePDFUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        const pdfData = e.target.result;
        
        currentNotebook.pages.push({
          type: 'pdf',
          content: '',
          drawing: null,
          pdfData: pdfData
        });

        renderPageList();
        loadPage(currentNotebook.pages.length - 1);
      };
      reader.readAsDataURL(file);
    }

    async function renderPDF(pdfData) {
      const loadingTask = pdfjsLib.getDocument(pdfData);
      const pdf = await loadingTask.promise;
      
      const viewer = document.getElementById('pdf-viewer');
      viewer.innerHTML = '';

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const scale = 1.5;
        const viewport = page.getViewport({ scale });

        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page';
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;

        viewer.appendChild(canvas);
      }
    }

    async function saveAndExit() {
      // Save current page state
      if (currentNotebook.pages[currentPageIndex].type === 'draw') {
        saveCanvasState();
      }

      const { error } = await db.updateNotebook(currentNotebook.id, currentNotebook.pages);
      
      if (error) {
        alert('Error saving notebook: ' + error.message);
        return;
      }

      window.location.href = 'notes.html';
    }

    // Auto-save every 30 seconds
    setInterval(async () => {
      if (currentNotebook) {
        if (currentNotebook.pages[currentPageIndex].type === 'draw') {
          saveCanvasState();
        }
        await db.updateNotebook(currentNotebook.id, currentNotebook.pages);
      }
    }, 30000);

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
